[item-description]
nullarbor-ferrous-shale=Iron-bearing shale. Process in a Pyromill to extract iron ore and solid fuel.
nullarbor-cupric-shale=Copper-bearing shale. Process in a Pyromill to extract copper ore and solid fuel.
nullarbor-bauxite=Bauxite ore. Process in a Pyromill to extract aluminum and stone.
nullarbor-pyromill=A specialized furnace for processing ferrous and cupric shale.
nullarbor-burner-assembling-machine=An assembling machine that burns fuel to operate.
nullarbor-condenser=Draws moisture from the desert air and condenses it into liquid water. Disabled in polluted areas.
nullarbor-burner-inserter-mk2=A reinforced burner inserter with aluminium-hardened arms. Twice the speed of a standard burner inserter.
nullarbor-distributor-crane=A heavy industrial crane that services a cluster of machines within its radius, collecting their outputs and distributing inputs through integrated belt loaders. No inserters needed.
nullarbor-gantry=A fuel-fired cargo gantry that straddles a rail line to load and unload wagons. Not yet operational.
nullarbor-aluminium=Aluminium. Refined from bauxite ore in a Pyromill.
nullarbor-uranium-aluminium-alloy=A dense alloy of uranium-238 and aluminium. Aluminium passivates the uranium surface, stabilising it against oxidation.
nullarbor-energetic-science-pack=Used by labs for research. Uranium-enhanced thermite that can also be burned as premium fuel.

