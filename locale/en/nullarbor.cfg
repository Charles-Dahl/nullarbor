[fluid-description]
nullarbor-irradiated-oil=Uranium-bearing crude oil seeping from deep-sand deposits. Must be refined to separate the oil fractions from the uranium isotopes.
nullarbor-radioactive-slurry=Dense uranium-rich sludge left over from refining irradiated oil. Process further to extract uranium isotopes.

