[technology-description]
nullarbor-pyromill=Unlocks the Pyromill, a burner furnace that processes ferrous and cupric shale into metal ores and solid fuel.
nullarbor-burner-assembling-machine=Unlocks the Burner Assembling Machine, a fuel-powered assembler for heavy Nullarbor recipes.
nullarbor-refining=Unlocks the refinery process for irradiated oil, separating it into heavy oil and radioactive slurry.
nullarbor-energetic-science-pack=Unlocks the Energetic Science Pack, a uranium-enhanced thermite that serves as both Nullarbor's science pack and a premium fuel.
nullarbor-solid-fuel-to-coal=Unlocks the process of cracking solid fuel into coal and petroleum gas in a chemical plant.
nullarbor-burner-inserter-mk2=Unlocks the Burner Inserter Mk2, an aluminium-reinforced burner inserter with double the speed.
nullarbor-distributor=Unlocks the Distributor, a belt-straddling inserter cluster that feeds up to four machines from a single belt.

